spring:
  application:
    name: FlightBooking

  datasource:
    url: jdbc:postgresql://localhost:5432/flight_db
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: Dev-HikariPool
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update      # auto creates/updates tables locally
    show-sql: true          # print SQL in console
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

